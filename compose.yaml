services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiftyar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-local-admin-password-change}
    # The image's temporary init server listens on a Unix socket only.
    # Probe TCP so Compose cannot mark PostgreSQL healthy before first init finishes.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shiftyar"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - shiftyar_pgdata:/var/lib/postgresql/data
  migrate:
    build: .
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/seed.mjs"]
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:${DB_ADMIN_PASSWORD:-local-admin-password-change}@postgres:5432/shiftyar
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-local-runtime-password-change}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-Shift-1405!}
      SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
  app:
    build: .
    environment:
      DATABASE_URL: postgres://restaurant_runtime:${DB_APP_PASSWORD:-local-runtime-password-change}@postgres:5432/shiftyar
      PORT: 3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-4500}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  shiftyar_pgdata:

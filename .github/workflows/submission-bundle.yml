name: Package ShiftYar release documents
on:
  push:
    branches: [main]
    paths:
      - 'SCOPE.md'
      - 'DECISIONS.md'
      - 'AI_USAGE.md'
      - 'HANDOVER.md'
      - 'README.md'
      - 'AI_PROMPTS.md'
      - 'SUBMISSION_CHECKLIST.md'
      - '.github/workflows/submission-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert all required documents exist
        run: |
          set -eu
          for file in README.md SCOPE.md DECISIONS.md AI_USAGE.md HANDOVER.md AI_PROMPTS.md SUBMISSION_CHECKLIST.md; do
            test -s "$file"
          done
      - name: Create upload-ready ZIP
        run: |
          mkdir -p dist/shiftyar-documentation
          cp README.md SCOPE.md DECISIONS.md AI_USAGE.md HANDOVER.md AI_PROMPTS.md SUBMISSION_CHECKLIST.md dist/shiftyar-documentation/
          cp SECURITY.md DEPLOY.md WALKTHROUGH.md dist/shiftyar-documentation/
          mkdir -p dist/shiftyar-documentation/docs
          cp docs/UX_BLUEPRINT.fa.md dist/shiftyar-documentation/docs/
          cd dist && zip -qr shiftyar-project-documentation.zip shiftyar-documentation
      - name: Upload release documentation
        uses: actions/upload-artifact@v4
        with:
          name: shiftyar-release-documents
          path: dist/shiftyar-project-documentation.zip
          retention-days: 7

name: Bootstrap free demo database (manual)
# Only run against the dedicated Neon DEMO database. Never production data.
on:
  workflow_dispatch:
    inputs:
      verify_url:
        description: Optional HTTPS demo origin to check after deployment (no trailing path)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: free-demo-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_DATABASE_URL: ${{ secrets.NEON_ADMIN_DATABASE_URL }}
      DB_APP_PASSWORD: ${{ secrets.DEMO_DB_APP_PASSWORD }}
      DEMO_PASSWORD: ${{ secrets.DEMO_LOGIN_PASSWORD }}
      SEED_DEMO: 'true'
      PUBLIC_DEMO_URL: ${{ inputs.verify_url }}
      DEMO_TEST_EMAIL: waiter@narenj.demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate required secrets without printing them
        run: |
          node --input-type=module -e "
            for (const key of ['ADMIN_DATABASE_URL','DB_APP_PASSWORD','DEMO_PASSWORD']) {
              if (!process.env[key]) throw Error(key + ' GitHub secret is missing');
            }
            if (process.env.DEMO_PASSWORD.length < 16) throw Error('DEMO_PASSWORD needs at least 16 characters');
            if (['local-runtime-password-change','test-only-runtime-password'].includes(process.env.DB_APP_PASSWORD)) throw Error('Change the default runtime password');
            if (['Demo-Shift-1405!','test-only-demo-password'].includes(process.env.DEMO_PASSWORD)) throw Error('Change the default demo password');
            const u = new URL(process.env.ADMIN_DATABASE_URL);
            if (!['postgres:','postgresql:'].includes(u.protocol)) throw Error('Invalid admin database URL');
            if (['localhost','127.0.0.1'].includes(u.hostname)) throw Error('Expected the dedicated remote Neon database');
          "
      - name: Create least-privilege runtime role and migrate
        run: npm run migrate
      - name: Seed two example restaurants (first run only)
        run: npm run seed
      - name: Verify HTTPS login and staff views (optional)
        if: ${{ inputs.verify_url != '' }}
        run: node scripts/verify-public-demo.mjs
